name: Build Android Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool libtool-bin pkg-config zlib1g-dev libncurses-dev libtinfo-dev cmake libffi-dev libssl-dev

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Accept Android SDK Licenses & Build AAB
        run: |
          # The 'yes |' command automatically accepts the Android SDK licenses prompted by buildozer
          yes | buildozer android release

      - name: Upload Unsigned AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JippyStore-Release-AAB
          path: bin/*.aab
          
      - name: Upload APK for Testing (Optional)
        # This uploads the APK if you change `android.release_artifact = apk` in buildozer.spec for testing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JippyStore-Release-APK
          path: bin/*.apk
